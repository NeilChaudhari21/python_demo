[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "warehouse-ops-toolkit"
version = "0.1.0"
description = "Command-line and library helpers for small warehouse operations teams."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Warehouse Operations Team" }
]
dependencies = [
  "packaging>=23.0"
]

[project.scripts]
warehouse-ops = "warehouse_ops.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"
